# Quay Agent — CI gate, as run from the monorepo root.
#
# The project keeps its own copy for when it is pushed as its own repository;
# that copy is inert here, because GitHub only reads .github/workflows from the
# repository root. This one adds the path filter, the working directory and a
# cache key spelled out to the project's uv.lock.
name: check (Quay Agent)

on:
  push:
    branches: [main]
    paths:
      - "Generative-AI/Quay_Agent/**"
      - ".github/workflows/check-quay-agent.yml"
  pull_request:
    paths:
      - "Generative-AI/Quay_Agent/**"
      - ".github/workflows/check-quay-agent.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-quay-agent-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Generative-AI/Quay_Agent

jobs:
  check:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: Generative-AI/Quay_Agent/uv.lock

      - name: Install the pinned interpreter
        run: uv python install

      - name: Install exactly what uv.lock pins
        run: make sync-ci

      - name: Report the environment under test
        run: make -s versions

      # lint, typecheck, test and doctest, in the project's own order.
      - name: make check
        run: make check
