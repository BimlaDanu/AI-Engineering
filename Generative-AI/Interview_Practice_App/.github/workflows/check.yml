# Interview Practice App — CI gate (standalone entry point).
#
# This copy is what runs when the app is pushed as a repository of its own,
# where the app is the repository root. Inside the AI-Engineering monorepo it
# is inert, because GitHub reads .github/workflows only from the repository
# root; there the entry point is .github/workflows/check-interview-practice-app.yml
# at that root.
#
# Both entry points call the same composite action, so there is one copy of the
# steps and nothing to keep in sync. Edit the gate in:
#   .github/actions/check/action.yml
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # A local action is read from the checked-out tree, so this comes first.
      - name: Check out the repository
        uses: actions/checkout@v5

      # working-directory defaults to ".", which is right here: the app is the
      # repository root in this layout.
      - name: Ruff and pytest
        uses: ./.github/actions/check
