# QuantumLab Copilot — CI gate, as run from the monorepo root.
#
# The project's own workflow says exactly what this file has to add: a
# working-directory default pointing back at the project, cache-dependency-glob
# spelled out to its uv.lock, and a paths filter so a sibling project's commit
# does not trigger it. Two homes, and only this root one is read.
#
# No OPENROUTER_API_KEY, and that omission is part of the test: the suite
# passes with skips because the model, store, tools and memory are injectable.
name: check (QuantumLab Copilot)

on:
  push:
    branches: [main]
    paths:
      - "Generative-AI/QuantumLab_Copilot/**"
      - ".github/workflows/check-quantumlab-copilot.yml"
  pull_request:
    paths:
      - "Generative-AI/QuantumLab_Copilot/**"
      - ".github/workflows/check-quantumlab-copilot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-quantumlab-copilot-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Generative-AI/QuantumLab_Copilot

jobs:
  check:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: Generative-AI/QuantumLab_Copilot/uv.lock

      # Reads .python-version. The pin is load-bearing: uv.lock resolves one
      # numpy below 3.12 and another at or above it, and the newer stubs are
      # 3.12 syntax that mypy, targeting 3.11, cannot parse.
      - name: Install the pinned interpreter
        run: uv python install

      - name: Install exactly what uv.lock pins
        run: make sync-ci

      # So a green run says which interpreter and which numpy it was green on.
      - name: Report the environment under test
        run: make -s versions

      # `make check` rather than its three targets spelled out, so what CI runs
      # and what the README tells a reader to run are the same string.
      - name: make check
        run: make check
