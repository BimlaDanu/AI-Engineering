# Runs the same gate as `make check`, on every push and pull request.
#
# The point is that the definition of done is one command, and that command is
# the same locally and here: if `make check` passes on a laptop it passes in CI,
# and the environment is not part of the difference because uv installs exactly
# what uv.lock pins.

name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the run still in flight for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install

      - name: Install the locked dependencies
        run: make sync-ci

      - name: Lint and format check
        run: make lint

      - name: Type check
        run: make typecheck

      - name: Tests
        run: make test
