# Interview Practice App — CI gate (monorepo entry point).
#
# A stub on purpose. GitHub starts workflows only from .github/workflows at the
# repository root, but the steps themselves belong to the project, so they live
# in a composite action inside it and this file holds only what a workflow file
# alone can carry: the trigger, the path filter and the permissions.
#
# Edit the gate here:
#   Generative-AI/Interview_Practice_App/.github/actions/check/action.yml
name: check

on:
  push:
    branches: [main]
    paths:
      - "Generative-AI/Interview_Practice_App/**"
      - ".github/workflows/check-interview-practice-app.yml"
  pull_request:
    paths:
      - "Generative-AI/Interview_Practice_App/**"
      - ".github/workflows/check-interview-practice-app.yml"
  workflow_dispatch:

permissions:
  contents: read

# Keyed on a literal id rather than ${{ github.workflow }}, which is the
# display name: several workflows here are called "check", and sharing a
# concurrency group would make one project's push cancel another's run.
concurrency:
  group: check-interview-practice-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # A local action is read from the checked-out tree, so this comes first.
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Ruff and pytest
        uses: ./Generative-AI/Interview_Practice_App/.github/actions/check
        with:
          working-directory: Generative-AI/Interview_Practice_App
