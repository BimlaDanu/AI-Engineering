# Synapse (AI_ML_Assistant) — CI gate, as run from the monorepo root.
#
# The project's own copy of this workflow is inert here: GitHub only reads
# .github/workflows from the repository root. This one adds the path filter,
# the working directory and a cache key spelled out to the project's uv.lock.
#
# Kept to first-party actions/* steps and pip-installed uv, matching the
# project's own workflow: organisations often restrict Actions to "actions
# created by GitHub", which makes a third-party action unresolvable and fails
# the run before a single step logs anything.
#
# Offline gate: the tests inject fake LLMs, KB and tools. Never add secrets.
name: check

on:
  push:
    branches: [main]
    paths:
      - "Generative-AI/AI_ML_Assistant/**"
      - ".github/workflows/check-ai-ml-assistant.yml"
  pull_request:
    paths:
      - "Generative-AI/AI_ML_Assistant/**"
      - ".github/workflows/check-ai-ml-assistant.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-ai-ml-assistant-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Generative-AI/AI_ML_Assistant

jobs:
  check:
    name: lint + format + tests (py3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Build the .venv on the interpreter setup-python installed rather than
      # downloading another one.
      UV_PYTHON: "3.11"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # The dependency tree is heavy (torch via sentence-transformers,
      # chromadb), so a warm cache is the difference between ~1 and ~6 minutes.
      - name: Cache uv downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py311-${{ hashFiles('Generative-AI/AI_ML_Assistant/uv.lock') }}
          restore-keys: uv-${{ runner.os }}-py311-

      - name: Install uv
        run: python -m pip install --upgrade uv

      # --locked fails if uv.lock has drifted from pyproject.toml, so a
      # dependency edit that was never synced is caught as an error.
      - name: Sync environment
        run: uv sync --locked

      # The three targets `make check` is made of, called by name rather than
      # re-spelled, so the gate cannot drift from the one in a terminal. Three
      # steps, so the Actions UI says which one failed.
      - name: Ruff lint
        run: make lint

      - name: Ruff format check
        run: make format-check

      - name: Tests
        run: make test
