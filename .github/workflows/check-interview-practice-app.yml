# Interview Practice App — CI gate, as run from the monorepo root.
#
# GitHub reads workflows from .github/workflows at the REPOSITORY root and
# nowhere else, so the copy inside the project folder is inert here. This one
# is the live gate: it filters on the project's path, runs every step from the
# project directory, and points the uv cache at the project's own uv.lock.
#
# Offline gate: the tests use fake clients, so no API key and no secrets. The
# Streamlit app and evals.py are out on purpose, they make paid calls.
name: check (Interview Practice App)

on:
  push:
    branches: [main]
    paths:
      - "Generative-AI/Interview_Practice_App/**"
      - ".github/workflows/check-interview-practice-app.yml"
  pull_request:
    paths:
      - "Generative-AI/Interview_Practice_App/**"
      - ".github/workflows/check-interview-practice-app.yml"
  workflow_dispatch:

permissions:
  contents: read

# Keyed on the workflow as well as the ref, so one project's push never
# cancels a sibling project's run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Generative-AI/Interview_Practice_App

jobs:
  check:
    name: lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: Generative-AI/Interview_Practice_App/uv.lock

      # Reads the project's .python-version and fetches 3.11 if the runner
      # lacks it. No setup-python step: two tools choosing an interpreter when
      # only one of them is consulted by `uv sync` is how you get a green
      # laptop and a red runner.
      - name: Install the pinned interpreter
        run: uv python install

      - name: Install exactly what uv.lock pins
        run: |
          uv sync --frozen || {
            echo "::error title=uv sync::uv.lock does not match pyproject.toml. Run 'uv lock' in the project and commit the result."
            exit 1
          }

      # The project has no sync-ci/typecheck targets, so the gate is its own
      # two: `make check` is lint + test.
      - name: Ruff
        run: |
          make lint || {
            echo "::error title=Ruff::Lint failed. Reproduce with 'make lint'; 'make format' fixes most of it."
            exit 1
          }

      - name: Pytest
        run: |
          make test || {
            echo "::error title=pytest::Unit tests failed. Reproduce with 'make test'."
            exit 1
          }
