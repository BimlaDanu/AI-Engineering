[project]
name = "mnist-mlp"
version = "0.1.0"
description = "Multi-layer perceptron for the Kaggle digit-recognizer (MNIST) classification task."
requires-python = ">=3.11,<3.12"

# Runtime dependencies only. Everything here is used by src/.
dependencies = [
    "torch>=2.2",
    "lightning>=2.2",
    "torchmetrics>=1.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tabulate>=0.9",  # pandas.to_markdown, used by the report writers
]

[dependency-groups]
# Tools used during development and in the quality gate, not by the trained model.
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
]
# Only needed to pull the competition CSVs from Kaggle.
data = ["kaggle>=1.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "N",   # PEP8 naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplifications
    "D",   # docstrings
]
ignore = [
    "D104",  # package docstring not required in every __init__.py
    "D107",  # __init__ documented in the class docstring instead
    "N812",  # `import torch.nn.functional as F` is the PyTorch convention
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["lightning.*", "sklearn.*", "seaborn.*", "matplotlib.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: tests that train a model and take noticeably longer"]
# A clean run should print nothing but the dots. These three warnings come out
# of Lightning and every one of them is a deliberate choice here, not a defect,
# so they are silenced by message rather than wholesale: a new warning still
# shows up.
filterwarnings = [
    # The Lightning tests pin accelerator="cpu" so that their comparison with
    # the plain loop is deterministic. Lightning sees the idle GPU and says so.
    "ignore:GPU available but not used:lightning.fabric.utilities.warnings.PossibleUserWarning",
    # num_workers=0 is the right setting here, not a bottleneck: the splits are
    # already tensors in memory, so workers would only copy them. See
    # TrainConfig.num_workers.
    "ignore:The '.*_dataloader' does not have many workers:lightning.fabric.utilities.warnings.PossibleUserWarning",
    # Lightning calls a deprecated torch internal. Nothing in src/ touches it.
    "ignore:`isinstance\\(treespec, LeafSpec\\)` is deprecated:FutureWarning",
]
